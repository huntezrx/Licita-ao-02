version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: licitacao_postgres_dev
    environment:
      POSTGRES_USER: licitacao
      POSTGRES_PASSWORD: licitacao_dev
      POSTGRES_DB: licitacao_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - licitacao_dev

  redis:
    image: redis:7-alpine
    container_name: licitacao_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - licitacao_dev

  adminer:
    image: adminer:latest
    container_name: licitacao_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - licitacao_dev

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: licitacao_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - licitacao_dev

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  licitacao_dev:
    driver: bridge
